[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uran-worker-sdk"
version = "1.0.0"
description = "Reference Python SDK for URAN JSONL process workers"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["uran_worker_sdk*"]
namespaces = false

[tool.setuptools]
include-package-data = false
